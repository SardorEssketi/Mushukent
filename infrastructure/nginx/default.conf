map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

map $uri $frontend_cache_control {
    default "";
    /index.html "no-store, no-cache, must-revalidate, max-age=0";
    /flutter_bootstrap.js "no-store, no-cache, must-revalidate, max-age=0";
    /flutter_service_worker.js "no-store, no-cache, must-revalidate, max-age=0";
    /main.dart.js "no-store, no-cache, must-revalidate, max-age=0";
    /version.json "no-store, no-cache, must-revalidate, max-age=0";
    /delete-account "no-store, no-cache, must-revalidate, max-age=0";
    /delete-account/delete-account.js "no-store, no-cache, must-revalidate, max-age=0";
    ~^/canvaskit/ "no-cache, must-revalidate, max-age=0";
    ~*\.(?:js|mjs|wasm|json)$ "no-cache, must-revalidate, max-age=0";
}

server {
    listen 80;
    server_name mushukistan.uz www.mushukistan.uz api.mushukistan.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name mushukistan.uz www.mushukistan.uz;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/mushukistan.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mushukistan.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' blob: https://www.gstatic.com https://fonts.gstatic.com https://tile.openstreetmap.org https://api.mushukistan.uz https://media.mushukistan.uz https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'none';" always;
    add_header Cache-Control $frontend_cache_control always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location = /flutter_bootstrap.js {
        try_files /flutter_bootstrap.js =404;
    }

    location = /flutter_service_worker.js {
        try_files /flutter_service_worker.js =404;
    }

    location = /main.dart.js {
        try_files /main.dart.js =404;
    }

    location = /version.json {
        try_files /version.json =404;
    }

    location ^~ /canvaskit/ {
        try_files $uri =404;
    }

    location ~* \.(?:js|mjs|wasm|json)$ {
        try_files $uri =404;
    }

    location = /delete-account {
        try_files /delete-account/index.html =404;
    }

    location = /delete-account/delete-account.js {
        try_files /delete-account/delete-account.js =404;
    }

    location = /privacy {
        try_files /privacy/index.html =404;
    }

    location = /child-safety {
        try_files /child-safety/index.html =404;
    }

    location /health {
        proxy_pass http://backend:8000/api/v1/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name api.mushukistan.uz;

    ssl_certificate /etc/letsencrypt/live/mushukistan.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mushukistan.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

    location /health {
        proxy_pass http://backend:8000/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
