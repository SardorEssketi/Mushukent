# Behind the Cloudflare proxy the peer is a Cloudflare edge; take the visitor's
# address from CF-Connecting-IP, but only from Cloudflare's published ranges
# (https://www.cloudflare.com/ips/, fetched 2026-10-30). Direct peers keep their
# own address, so the header cannot be forged from outside Cloudflare. Without
# this, the backend's per-IP rate limit would bucket all visitors by edge address.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# A missing hashed asset must not stay cached as an error across releases.
map $status $landing_asset_cache_control {
    default "no-store, max-age=0";
    ~^[23] "public, max-age=31536000, immutable";
}

map $uri $frontend_cache_control {
    default "";
    / "no-store, no-cache, must-revalidate, max-age=0";
    /en/ "no-store, no-cache, must-revalidate, max-age=0";
    /uz/ "no-store, no-cache, must-revalidate, max-age=0";
    /en/index.html "no-store, no-cache, must-revalidate, max-age=0";
    /uz/index.html "no-store, no-cache, must-revalidate, max-age=0";
    /robots.txt "no-store, max-age=0";
    /sitemap.xml "no-store, max-age=0";
    ~^/landing-assets/ $landing_asset_cache_control;
    /index.html "no-store, no-cache, must-revalidate, max-age=0";
    /flutter_bootstrap.js "no-store, no-cache, must-revalidate, max-age=0";
    /flutter_service_worker.js "no-store, no-cache, must-revalidate, max-age=0";
    # Revalidated on every load (304 when unchanged) instead of re-downloaded:
    # the bundle is several MB and slow evening links cannot fetch it each visit.
    /main.dart.js "no-cache, must-revalidate, max-age=0";
    /version.json "no-store, no-cache, must-revalidate, max-age=0";
    /delete-account "no-store, no-cache, must-revalidate, max-age=0";
    /delete-account/delete-account.js "no-store, no-cache, must-revalidate, max-age=0";
    ~^/canvaskit/ "no-cache, must-revalidate, max-age=0";
    ~*\.(?:js|mjs|wasm|json)$ "no-cache, must-revalidate, max-age=0";
}

server {
    listen 80;
    server_name mushukistan.uz www.mushukistan.uz api.mushukistan.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name mushukistan.uz www.mushukistan.uz;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/mushukistan.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mushukistan.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Five 10 MiB images plus multipart fields/boundaries must fit end to end.
    client_max_body_size 55m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' blob: https://www.gstatic.com https://fonts.gstatic.com https://tile.openstreetmap.org https://api.mushukistan.uz https://media.mushukistan.uz https://accounts.google.com https://eu.i.posthog.com; frame-src https://accounts.google.com; frame-ancestors 'none';" always;
    add_header Cache-Control $frontend_cache_control always;

    # The Flutter bundle and CanvasKit are about 10 MB raw and 3-4 MB gzipped.
    # JSON is left out so API responses (which may carry tokens) stay uncompressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript application/wasm text/css
               text/plain image/svg+xml application/xml
               font/otf font/ttf;

    location /api/ {
        client_body_timeout 120s;
        proxy_pass http://backend:8000;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 180s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Landing files live outside Flutter's document root. Only these exact
    # routes are public pages; every application deep link keeps Flutter.
    location = / {
        root /var/www/landing;
        try_files /index.html =404;
    }

    # Russian moved to the root; keep the former /ru/ URL working.
    location = /ru { return 301 /; }
    location = /ru/ { return 301 /; }
    location = /en { return 308 /en/; }
    location = /uz { return 308 /uz/; }

    location = /en/ {
        root /var/www/landing;
        try_files /en/index.html =404;
    }

    location = /uz/ {
        root /var/www/landing;
        try_files /uz/index.html =404;
    }

    location = /robots.txt {
        root /var/www/landing;
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        root /var/www/landing;
        try_files /sitemap.xml =404;
    }

    location ^~ /landing-assets/ {
        root /var/www/landing;
        try_files $uri =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location = /flutter_bootstrap.js {
        try_files /flutter_bootstrap.js =404;
    }

    location = /flutter_service_worker.js {
        try_files /flutter_service_worker.js =404;
    }

    location = /main.dart.js {
        try_files /main.dart.js =404;
    }

    location = /version.json {
        try_files /version.json =404;
    }

    location ^~ /canvaskit/ {
        try_files $uri =404;
    }

    location ~* \.(?:js|mjs|wasm|json)$ {
        try_files $uri =404;
    }

    location = /delete-account {
        try_files /delete-account/index.html =404;
    }

    location = /delete-account/delete-account.js {
        try_files /delete-account/delete-account.js =404;
    }

    location = /privacy {
        try_files /privacy/index.html =404;
    }

    location = /child-safety {
        try_files /child-safety/index.html =404;
    }

    location /health {
        proxy_pass http://backend:8000/api/v1/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name api.mushukistan.uz;

    ssl_certificate /etc/letsencrypt/live/mushukistan.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mushukistan.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Five 10 MiB images plus multipart fields/boundaries must fit end to end.
    client_max_body_size 55m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

    location /health {
        proxy_pass http://backend:8000/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        client_body_timeout 120s;
        proxy_pass http://backend:8000;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 180s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
