# Include only after provisioning private FCM credentials and the encryption key.
services:
  backend:
    environment:
      FIREBASE_CREDENTIALS_FILE: /run/secrets/firebase-admin.json
    volumes:
      - ${FIREBASE_CREDENTIALS_HOST_PATH:?Set FIREBASE_CREDENTIALS_HOST_PATH}:/run/secrets/firebase-admin.json:ro

  notification-worker:
    environment:
      FIREBASE_CREDENTIALS_FILE: /run/secrets/firebase-admin.json
    volumes:
      - ${FIREBASE_CREDENTIALS_HOST_PATH:?Set FIREBASE_CREDENTIALS_HOST_PATH}:/run/secrets/firebase-admin.json:ro
