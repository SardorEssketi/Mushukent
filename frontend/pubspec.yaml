name: mushukistan_frontend
description: Mushukistan Flutter MVP skeleton
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.1
  intl: ^0.20.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.4
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  file_picker: ^11.0.2
  image_picker: 1.1.2
  http_parser: ^4.1.2
  google_sign_in: 7.2.0
  google_sign_in_web: 1.1.3
  image: ^4.8.0
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  flutter_launcher_icons: ^0.14.4
  json_serializable: ^6.8.0

dependency_overrides:
  image_picker_android: 0.8.12+17

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_icon.png
  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: assets/app_icon.png
