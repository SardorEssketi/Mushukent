<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Without this, mobile browsers render the startup screen at ~980px and shrink it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Mushukistan is a social map for street cats and lost pets in Tashkent.">
  <meta name="robots" content="noindex,follow">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mushukistan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mushukistan</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #faf6f1;
      color: #211c19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #flutter-startup {
      box-sizing: border-box;
      min-height: 100%;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    }

    .startup-card {
      width: min(100%, 360px);
      text-align: center;
    }

    .startup-mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: block;
      object-fit: contain;
    }

    .startup-title {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .startup-status {
      margin: 10px 0 0;
      color: #6b615a;
      line-height: 1.45;
    }

    .startup-progress {
      width: 32px;
      height: 32px;
      box-sizing: border-box;
      margin: 22px auto 0;
      border: 3px solid #f3d9cc;
      border-top-color: #b8431f;
      border-radius: 50%;
      animation: startup-spin 0.9s linear infinite;
    }

    .startup-recovery {
      visibility: hidden;
      margin-top: 20px;
      animation: startup-reveal 0s 20s forwards;
    }

    .startup-failed .startup-progress {
      display: none;
    }

    .startup-failed .startup-recovery {
      visibility: visible;
      animation: none;
    }

    .startup-retry {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      background: #b8431f;
      color: white;
      font-weight: 700;
      text-decoration: none;
    }

    @keyframes startup-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes startup-reveal {
      to { visibility: visible; }
    }

    @media (prefers-color-scheme: dark) {
      html, body { background: #171210; color: #f0e3db; }
      .startup-status { color: #d8c6bb; }
      .startup-progress { border-color: #4e433c; border-top-color: #ffb59e; }
    }
  </style>
</head>
<body>
  <div id="flutter-startup" role="status" aria-live="polite">
    <div class="startup-card">
      <img class="startup-mark" src="/icons/Icon-192.png" width="54" height="54" alt="" aria-hidden="true">
      <h1 class="startup-title">Mushukistan</h1>
      <p id="flutter-startup-status" class="startup-status">Loading Mushukistan…</p>
      <div class="startup-progress" aria-hidden="true"></div>
      <div class="startup-recovery">
        <p class="startup-status">This is taking longer than expected.</p>
        <a class="startup-retry" href="">Try again</a>
      </div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
