name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# One run per ref; a newer push cancels the older run instead of queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: ruff check app tests scripts
      - name: Black
        # tests/test_feed_map.py has pre-existing formatting debt; remove the exclusion once it is
        # reformatted.
        run: black --check app tests scripts --extend-exclude "tests/test_feed_map.py"

  backend-tests:
    name: Backend tests (PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # Disposable database that exists only for this job. Nothing here can reach a real database:
      # the credentials are throwaway, the host is the job's own service container, and
      # backend/tests/db_safety.py refuses any database whose name does not contain "test".
      postgis:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password_not_a_secret
          POSTGRES_DB: mushukistan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d mushukistan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Explicit test environment. No PostHog, Firebase, Resend or Cloudflare credentials are set:
      # analytics are optional and storage falls back to local files outside production.
      APP_ENV: test
      RUN_DB_INTEGRATION_TESTS: '1'
      TEST_DATABASE_URL: postgresql+psycopg://ci_user:ci_password_not_a_secret@localhost:5432/mushukistan_test
      JWT_SECRET_KEY: ci-only-signing-key-not-used-anywhere-else-0123456789
      OTEL_SDK_DISABLED: 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Migrations apply, roll back and re-apply on an empty database
        env:
          DATABASE_URL: postgresql+psycopg://ci_user:ci_password_not_a_secret@localhost:5432/mushukistan_migrations_test
          PGPASSWORD: ci_password_not_a_secret
        run: |
          psql -h localhost -U ci_user -d mushukistan_test -c 'CREATE DATABASE mushukistan_migrations_test'
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Pytest (unit, integration, security and configuration regression tests)
        # No --maxfail and no `|| true`: every failure is reported and fails the job.
        run: pytest -ra --durations=15

  frontend-quality:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: subosito/flutter-action@v2.18.0
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - name: Install frontend dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
