# Emulated production host for load tests. Never point this at a real database or service.
#
# The emulated box is a small single-host VPS: db + backend + notification worker + nginx on one
# machine (sized from the operator's private production notes; those details stay private).
# Emulation:
#   * every "box" service runs under ONE parent cgroup (tools/loadbox.sh): one CPU budget calibrated
#     so a production core = 0.28 of a workstation core (measured with remote-inspect.sh capacity),
#     and one shared memory pool without swap or per-container caps, as on the production host;
#   * the live backend image (mushukistan-backend:${BACKEND_TAG}), APP_ENV=production, the
#     production single-worker uvicorn command and the production nginx config verbatim;
#   * PostGIS 15-3.4 with default settings (as in production), plus pg_stat_statements and lock
#     wait logging for observation only.
# External services (R2, PostHog, FCM) are redirected to `mocks`, which runs OUTSIDE the box
# (not in the loadbox cgroup), because in production they are remote.
#
# Usage: see loadtest/README.md (`bash loadtest/run.sh up`).

name: mushukistan-load

x-box-cpu: &box_cpu
  # Shared parent cgroup created by tools/loadbox.sh: one CPU budget and one memory pool for all
  # box services, no swap, no per-container caps (as on the production host).
  cgroup_parent: loadbox
  restart: unless-stopped

services:
  db:
    image: postgis/postgis:15-3.4
    <<: *box_cpu
    environment:
      POSTGRES_DB: mushukistan_load
      POSTGRES_USER: mushukistan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run loadtest/run.sh secrets first}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      - -c
      - log_min_duration_statement=500
      - -c
      - track_io_timing=on
      - -c
      # Production default is 2; FIX-10 sets 0 (pass PG_PARALLEL_PER_GATHER=0 for "after" runs).
      - max_parallel_workers_per_gather=${PG_PARALLEL_PER_GATHER:-2}
    volumes:
      # PG_VOLUME=load_pg (1x data) or load_pg_x10 (10x data); see README.
      - ${PG_VOLUME:-load_pg}:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mushukistan -d mushukistan_load"]
      interval: 10s  # as in production
      timeout: 5s
      retries: 20

  backend:
    image: mushukistan-backend:${BACKEND_TAG:-8939818}
    <<: *box_cpu
    depends_on:
      db:
        condition: service_healthy
      mocks:
        condition: service_started
    env_file:
      - ./loadtest.env
      - ./.secrets/secrets.env
    environment:
      DATABASE_URL: postgresql+psycopg://mushukistan:${POSTGRES_PASSWORD}@db:5432/mushukistan_load
      PYTHONPATH: /loadtest-shim
      LOADTEST_POOL_LOG: /loadtest-out/pool.jsonl
      LOADTEST_TRACE: ${LOADTEST_TRACE:+/loadtest-out/trace.jsonl}  # LOADTEST_TRACE=1: per-request time breakdown
      MAX_IN_FLIGHT_REQUESTS: ${MAX_IN_FLIGHT_REQUESTS:-48}
      IN_FLIGHT_QUEUE_SECONDS: ${IN_FLIGHT_QUEUE_SECONDS:-0}  # perf/cap-queue images only
      RATE_LIMIT_PUBLIC_READ_PER_MINUTE: ${RATE_LIMIT_PUBLIC_READ_PER_MINUTE:-180}
    volumes:
      - ./shim:/loadtest-shim:ro
      - ./.secrets/firebase-admin.json:/run/secrets/firebase-admin.json:ro
      - ./results/_runtime:/loadtest-out
    # Production overlay command: single uvicorn worker, no auto-migration.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # Production's healthcheck: command, interval, timeout, retries and start timing match the
    # deployed container (read-only inspection 2026-11-14). It runs WITHOUT the shim (production
    # has no PYTHONPATH): with PYTHONPATH=/loadtest-shim every check imported app modules (1.28 s
    # of workstation CPU instead of 0.24 s) and, every 10 s, added ~0.35 production core to the box.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PYTHONPATH= python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s

  notification-worker:
    image: mushukistan-backend:${BACKEND_TAG:-8939818}
    <<: *box_cpu
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./loadtest.env
      - ./.secrets/secrets.env
    environment:
      DATABASE_URL: postgresql+psycopg://mushukistan:${POSTGRES_PASSWORD}@db:5432/mushukistan_load
      PYTHONPATH: /loadtest-shim
    volumes:
      - ./shim:/loadtest-shim:ro
      - ./.secrets/firebase-admin.json:/run/secrets/firebase-admin.json:ro
    command: ["python", "-m", "app.features.notifications.application.worker"]

  nginx:
    image: nginx:1.27-alpine
    <<: *box_cpu
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:18443:443"
    volumes:
      - ../infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.secrets/live:/etc/letsencrypt/live:ro
      - ./nginx/empty:/usr/share/nginx/html:ro
      - ./nginx/empty:/var/www/landing:ro
      - ./nginx/empty:/var/www/certbot:ro

  # Remote services (R2, PostHog). Not part of the emulated box.
  mocks:
    image: mushukistan-backend:${BACKEND_TAG:-8939818}
    entrypoint: ["python", "/mocks/mock_server.py"]
    environment:
      MOCK_LATENCY_MS: "40"
    volumes:
      - ./mocks:/mocks:ro
    ports:
      - "127.0.0.1:19000:9000"

  # One-shot helpers (profiles keep them out of `up`).
  migrate:
    image: mushukistan-backend:${BACKEND_TAG:-8939818}
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./loadtest.env
      - ./.secrets/secrets.env
    environment:
      DATABASE_URL: postgresql+psycopg://mushukistan:${POSTGRES_PASSWORD}@db:5432/mushukistan_load
      PYTHONPATH: /loadtest-shim
    volumes:
      - ./shim:/loadtest-shim:ro
      - ./.secrets/firebase-admin.json:/run/secrets/firebase-admin.json:ro
    command: ["alembic", "upgrade", "head"]

  seed:
    image: mushukistan-backend:${BACKEND_TAG:-8939818}
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./loadtest.env
      - ./.secrets/secrets.env
    environment:
      DATABASE_URL: postgresql+psycopg://mushukistan:${POSTGRES_PASSWORD}@db:5432/mushukistan_load
    volumes:
      - ./seed:/seed:ro
      - ./results:/results
    entrypoint: ["python", "/seed/seed.py"]

volumes:
  load_pg:
  load_pg_x10:
