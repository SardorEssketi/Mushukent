services:
  # NEEDS OWNER APPROVAL BEFORE DEPLOY (load audit FIX-10). On a single-core host a parallel query
  # worker adds no CPU, but each one starts PostGIS again and costs memory during overload. Takes
  # effect when the db container is recreated; to apply without a restart, run
  # ALTER SYSTEM SET max_parallel_workers_per_gather = 0; SELECT pg_reload_conf();
  db:
    command: ["postgres", "-c", "max_parallel_workers_per_gather=0"]

  backend:
    ports: !reset []
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      ENABLE_API_DOCS: "false"

  notification-worker:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/build/web:/usr/share/nginx/html:ro
      - ./website/dist:/var/www/landing:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # ACME HTTP-01 challenge webroot: a fixed host directory, independent of release directories,
      # written by the host's certbot (webroot authenticator) and served by Nginx. See docs/TLS_RENEWAL.md.
      - /var/www/certbot:/var/www/certbot:ro
