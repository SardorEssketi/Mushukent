# Bounded Docker logs (LT-20 step 2): the host health timer reads Nginx's log every minute, and
# unbounded json-file logs would also fill the disk. Applied when each container is next
# recreated by its normal release procedure. The db service is deliberately left unchanged,
# so no release ever recreates the database container for a logging change.
x-ops-logging: &ops-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    ports: !reset []
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      ENABLE_API_DOCS: "false"
    logging: *ops-logging

  notification-worker:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    logging: *ops-logging

  nginx:
    logging: *ops-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/build/web:/usr/share/nginx/html:ro
      - ./website/dist:/var/www/landing:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # ACME HTTP-01 challenge webroot: a fixed host directory, independent of release directories,
      # written by the host's certbot (webroot authenticator) and served by Nginx. See docs/TLS_RENEWAL.md.
      - /var/www/certbot:/var/www/certbot:ro
