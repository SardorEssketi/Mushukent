services:
  backend:
    ports: !reset []
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      ENABLE_API_DOCS: "false"

  notification-worker:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/build/web:/usr/share/nginx/html:ro
      - ./website/dist:/var/www/landing:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # ACME HTTP-01 challenge webroot: a fixed host directory, independent of release directories,
      # written by the host's certbot (webroot authenticator) and served by Nginx. See docs/TLS_RENEWAL.md.
      - /var/www/certbot:/var/www/certbot:ro
